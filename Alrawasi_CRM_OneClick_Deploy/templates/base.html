<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRM تلال الرواسي</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><style>body{background:#f5f6f8}.navbar{background:#111827}.card{border:0;box-shadow:0 2px 10px #0000000d}.stat{font-size:1.7rem;font-weight:700}.table td,.table th{vertical-align:middle}.ltr{direction:ltr;unicode-bidi:plaintext}
.status-badge{display:inline-block;padding:.35rem .65rem;border-radius:999px;font-weight:700;font-size:.82rem}
tr.status-new{background:#fff!important}.status-badge.status-new{background:#e9ecef;color:#343a40}
tr.status-contacted{background:#e7f1ff!important}.status-badge.status-contacted{background:#0d6efd;color:#fff}
tr.status-interested{background:#fff3cd!important}.status-badge.status-interested{background:#ffc107;color:#212529}
tr.status-quote-requested{background:#f3e8ff!important}.status-badge.status-quote-requested{background:#6f42c1;color:#fff}
tr.status-quote-sent{background:#e2d9f3!important}.status-badge.status-quote-sent{background:#59359a;color:#fff}
tr.status-followup{background:#cff4fc!important}.status-badge.status-followup{background:#0dcaf0;color:#073642}
tr.status-contracted{background:#d1e7dd!important}.status-badge.status-contracted{background:#198754;color:#fff}
tr.status-not-interested{background:#f8d7da!important}.status-badge.status-not-interested{background:#dc3545;color:#fff}
tr.status-unreachable{background:#e9ecef!important}.status-badge.status-unreachable{background:#6c757d;color:#fff}
tr.status-postponed{background:#ffe5d0!important}.status-badge.status-postponed{background:#fd7e14;color:#fff}
</style></head><body><nav class="navbar navbar-dark mb-4"><div class="container-fluid"><a class="navbar-brand" href="/">تلال الرواسي CRM</a>{% if user %}<div class="d-flex gap-2 align-items-center text-white"><a class="btn btn-sm btn-outline-light" href="/companies">الشركات</a><a class="btn btn-sm btn-outline-light" href="/export">تصدير</a>{% if session.role=='admin' %}<a class="btn btn-sm btn-outline-light" href="/users">المستخدمون</a>{% endif %}<span>{{user}}</span><a class="btn btn-sm btn-light" href="/logout">خروج</a></div>{% endif %}</div></nav><main class="container pb-5">{% with messages=get_flashed_messages() %}{% for m in messages %}<div class="alert alert-warning">{{m}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
