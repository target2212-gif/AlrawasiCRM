<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRM تلال الرواسي</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><style>body{background:#f5f6f8}.navbar{background:#111827}.card{border:0;box-shadow:0 2px 10px #0000000d}.stat{font-size:1.7rem;font-weight:700}.table td,.table th{vertical-align:middle}.ltr{direction:ltr;unicode-bidi:plaintext}</style></head><body><nav class="navbar navbar-dark mb-4"><div class="container-fluid"><a class="navbar-brand" href="/">تلال الرواسي CRM</a>{% if user %}<div class="d-flex gap-2 align-items-center text-white"><a class="btn btn-sm btn-outline-light" href="/companies">الشركات</a><a class="btn btn-sm btn-outline-light" href="/export">تصدير</a>{% if session.role=='admin' %}<a class="btn btn-sm btn-outline-light" href="/users">المستخدمون</a>{% endif %}<span>{{user}}</span><a class="btn btn-sm btn-light" href="/logout">خروج</a></div>{% endif %}</div></nav><main class="container pb-5">{% with messages=get_flashed_messages() %}{% for m in messages %}<div class="alert alert-warning">{{m}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
