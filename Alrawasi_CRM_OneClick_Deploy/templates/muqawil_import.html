{% extends 'base.html' %}{% block content %}
<div class="card p-4"><h3>تحديث بيانات منصة مقاول</h3>
<p class="text-muted">ارفع ملف JSON الحديث. يقبل النظام بيانات منصة مقاول فقط. بيانات التواصل والمتابعة والمندوب وحالة العميل في CRM لا يتم تغييرها.</p>
<form method="post" enctype="multipart/form-data">
<input class="form-control mb-3" type="file" name="file" accept=".json,application/json" required>
<button class="btn btn-primary">فحص الملف وتحديث مقاول</button>
</form></div>{% endblock %}
