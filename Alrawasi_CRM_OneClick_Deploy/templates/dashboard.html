{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between align-items-center mb-3"><h2>لوحة التحكم</h2><a class="btn btn-dark" href="/companies">فتح الشركات</a></div><div class="row g-3"><div class="col-md-3"><div class="card p-3"><div>إجمالي الشركات</div><div class="stat">{{total}}</div></div></div>{% for k,v in counts.items() %}<div class="col-md-3"><div class="card p-3"><div>{{status[k]}}</div><div class="stat">{{v}}</div></div></div>{% endfor %}<div class="col-md-3"><div class="card p-3"><div>متابعات مستحقة</div><div class="stat">{{follow}}</div></div></div></div><div class="card p-3 mt-4"><h5>توزيع الشركات على المندوبين</h5><table class="table"><tr><th>المندوب</th><th>عدد الشركات</th></tr>{% for r in reps %}<tr><td>{{r.name}}</td><td>{{r.n}}</td></tr>{% endfor %}</table></div>{% endblock %}
