{% extends 'base.html' %}{% block content %}<h2>المستخدمون والمندوبون</h2><div class="card p-3 mb-3"><h5>إضافة مستخدم</h5><form method="post" action="/users/add" class="row g-2"><div class="col-md-3"><input class="form-control" name="name" placeholder="الاسم" required></div><div class="col-md-3"><input class="form-control" name="email" type="email" placeholder="البريد" required></div><div class="col-md-2"><input class="form-control" name="password" placeholder="كلمة المرور" required></div><div class="col-md-2"><select class="form-select" name="role"><option value="rep">مندوب</option><option value="manager">مشرف</option><option value="admin">مدير</option></select></div><div class="col-md-2"><select class="form-select" name="specialty">{% for k,v in specialties.items() %}<option value="{{k}}">{{v}}</option>{% endfor %}</select></div><div class="col-12"><textarea class="form-control" name="whatsapp_template" rows="2" placeholder="رسالة واتساب مخصصة (اختياري). استخدم {{'{{rep_name}}'}} و {{'{{company_name}}'}}"></textarea></div><div class="col-12"><button class="btn btn-dark">إضافة</button></div></form></div>{% for u in rows %}<div class="card p-3 mb-3"><form method="post" action="/users/{{u.id}}/update"><div class="row g-2 align-items-center"><div class="col-md-3"><b>{{u.name}}</b><div class="small text-muted">{{u.email}} — {{u.role}}</div></div><div class="col-md-3"><select class="form-select" name="specialty">{% for k,v in specialties.items() %}<option value="{{k}}" {% if u.specialty==k %}selected{% endif %}>{{v}}</option>{% endfor %}</select></div><div class="col-md-5"><textarea class="form-control" name="whatsapp_template" rows="3">{{u.whatsapp_template or default_messages.get(u.specialty or 'general','')}}</textarea></div><div class="col-md-1"><button class="btn btn-dark w-100">حفظ</button></div></div></form></div>{% endfor %}{% endblock %}
