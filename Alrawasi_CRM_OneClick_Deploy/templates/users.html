{% extends 'base.html' %}{% block content %}<h2>المستخدمون والمندوبون</h2><div class="card p-3 mb-3"><form method="post" action="/users/add" class="row g-2"><div class="col"><input class="form-control" name="name" placeholder="الاسم" required></div><div class="col"><input class="form-control" name="email" type="email" placeholder="البريد" required></div><div class="col"><input class="form-control" name="password" placeholder="كلمة المرور" required></div><div class="col"><select class="form-select" name="role"><option value="rep">مندوب</option><option value="manager">مشرف</option><option value="admin">مدير</option></select></div><div class="col"><button class="btn btn-dark">إضافة</button></div></form></div><div class="card p-3"><table class="table"><tr><th>الاسم</th><th>البريد</th><th>الدور</th><th>الحالة</th></tr>{% for u in rows %}<tr><td>{{u.name}}</td><td>{{u.email}}</td><td>{{u.role}}</td><td>{{'نشط' if u.active else 'متوقف'}}</td></tr>{% endfor %}</table></div>{% endblock %}
