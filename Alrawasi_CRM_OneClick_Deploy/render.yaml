services:
  - type: web
    name: alrawasi-crm
    runtime: docker
    plan: starter
    rootDir: Alrawasi_CRM_OneClick_Deploy
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PORT
        value: 5000
      - key: DATA_DIR
        value: /var/data
      - key: MUQAWIL_SYNC_TOKEN
        generateValue: true

    disk:
      name: alrawasi-crm-data
      mountPath: /var/data
      sizeGB: 1
