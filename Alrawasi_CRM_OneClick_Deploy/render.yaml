services:
  - type: web
    name: alrawasi-crm
    runtime: docker
    plan: free
    rootDir: Alrawasi_CRM_OneClick_Deploy
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PORT
        value: 5000
      - key: MUQAWIL_SYNC_TOKEN
        generateValue: true

  - type: cron
    name: alrawasi-muqawil-daily-sync
    runtime: python
    rootDir: Alrawasi_CRM_OneClick_Deploy
    schedule: "0 4 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python sync_cron.py
    envVars:
      - key: CRM_BASE_URL
        value: https://alrawasi-crm.onrender.com
      - key: MUQAWIL_SYNC_TOKEN
        sync: false
