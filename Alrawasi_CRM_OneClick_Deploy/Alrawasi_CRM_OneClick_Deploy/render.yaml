services:
  - type: web
    name: alrawasi-crm
    runtime: docker
    plan: free
    rootDir: Alrawasi_CRM_OneClick_Deploy
    healthCheckPath: /health
    envVars:
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: PORT
        value: 5000
      - key: DATA_DIR
        value: /tmp/alrawasi-data
      - key: MUQAWIL_SYNC_TOKEN
        generateValue: true
